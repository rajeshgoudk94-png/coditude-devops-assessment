name: Infrastructure Validation and Deployment

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infrastructure.yml'

  workflow_dispatch:
    inputs:
      template:
        description: CloudFormation template to deploy
        type: choice
        required: true
        options:
          - network.yaml
          - ecr.yaml
          - release-bucket.yaml
          - database.yaml
          - ecs-app.yaml
          - ec2-app.yaml
          - codedeploy.yaml

      stack_name:
        description: Target CloudFormation stack name
        type: string
        required: true

      parameter_overrides:
        description: 'Space-separated parameters, e.g. EnvironmentName=dev VpcId=vpc-123'
        type: string
        required: false
        default: ''

      confirm_deployment:
        description: Confirm that AWS infrastructure should be deployed
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate CloudFormation templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        run: python -m pip install cfn-lint

      - name: Lint all CloudFormation templates
        run: cfn-lint infra/templates/*.yaml

      - name: Validate selected template input
        if: github.event_name == 'workflow_dispatch'
        env:
          TEMPLATE: ${{ inputs.template }}
        run: |
          set -euo pipefail

          case "$TEMPLATE" in
            network.yaml|ecr.yaml|release-bucket.yaml|database.yaml|ecs-app.yaml|ec2-app.yaml|codedeploy.yaml)
              test -f "infra/templates/$TEMPLATE"
              ;;
            *)
              echo "::error::Unsupported CloudFormation template: $TEMPLATE"
              exit 1
              ;;
          esac

  deploy:
    name: Deploy selected CloudFormation stack
    runs-on: ubuntu-latest
    needs: validate

    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_deployment == true

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GitHub OIDC context
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
          GH_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          echo "Repository: $GH_REPOSITORY"
          echo "Ref: $GH_REF"
          echo "Event: $GH_EVENT"

          [[ "$GH_REPOSITORY" == "rajeshgoudk94-png/coditude-devops-assessment" ]] || {
            echo "::error::Unexpected GitHub repository"
            exit 1
          }

          [[ "$GH_REF" == "refs/heads/master" ]] || {
            echo "::error::Deployment must run from master"
            exit 1
          }

          [[ "$GH_EVENT" == "workflow_dispatch" ]] || {
            echo "::error::Deployment must be manually triggered"
            exit 1
          }

      - name: Check required configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CFN_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
          STACK_NAME: ${{ inputs.stack_name }}
          TEMPLATE: ${{ inputs.template }}
        run: |
          set -euo pipefail

          [[ -n "$AWS_ROLE_ARN" ]] || {
            echo "::error::AWS_ROLE_ARN variable is missing"
            exit 1
          }

          [[ -n "$AWS_REGION" ]] || {
            echo "::error::AWS_REGION variable is missing"
            exit 1
          }

          [[ -n "$CFN_ROLE_ARN" ]] || {
            echo "::error::CLOUDFORMATION_EXECUTION_ROLE_ARN variable is missing"
            exit 1
          }

          [[ -n "$STACK_NAME" ]] || {
            echo "::error::Stack name is required"
            exit 1
          }

          case "$TEMPLATE" in
            network.yaml|ecr.yaml|release-bucket.yaml|database.yaml|ecs-app.yaml|ec2-app.yaml|codedeploy.yaml)
              [[ -f "infra/templates/$TEMPLATE" ]] || {
                echo "::error::Template file not found: infra/templates/$TEMPLATE"
                exit 1
              }
              ;;
            *)
              echo "::error::Unsupported CloudFormation template: $TEMPLATE"
              exit 1
              ;;
          esac

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsInfrastructure
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Validate selected template in AWS
        env:
          TEMPLATE: ${{ inputs.template }}
        run: |
          set -euo pipefail

          aws cloudformation validate-template \
            --template-body "file://infra/templates/${TEMPLATE}"

      - name: Deploy CloudFormation stack
        env:
          STACK_NAME: ${{ inputs.stack_name }}
          TEMPLATE: ${{ inputs.template }}
          PARAMS: ${{ inputs.parameter_overrides }}
          CFN_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          DEPLOY_ARGS=(
            --template-file "infra/templates/${TEMPLATE}"
            --stack-name "$STACK_NAME"
            --role-arn "$CFN_ROLE_ARN"
            --capabilities CAPABILITY_IAM
            --no-fail-on-empty-changeset
          )

          if [[ -n "$PARAMS" ]]; then
            read -r -a PARAM_ARRAY <<< "$PARAMS"
            DEPLOY_ARGS+=(--parameter-overrides "${PARAM_ARRAY[@]}")
          fi

          echo "Deploying template: $TEMPLATE"
          echo "Target stack: $STACK_NAME"
          echo "Region: $AWS_REGION"

          aws cloudformation deploy "${DEPLOY_ARGS[@]}"
