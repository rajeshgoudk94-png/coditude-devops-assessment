
name: Infrastructure Validation and Deployment

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infrastructure.yml'

  workflow_dispatch:
    inputs:
      template:
        description: CloudFormation template to deploy
        type: choice
        required: true
        options:
          - network.yaml
          - ecr.yaml
          - release-bucket.yaml
          - database.yaml
          - ecs-app.yaml
          - ec2-app.yaml
          - codedeploy.yaml

      stack_name:
        description: Target CloudFormation stack name
        type: string
        required: true

      parameter_overrides:
        description: Space-separated parameters, e.g. EnvironmentName=dev VpcId=vpc-123
        type: string
        required: false
        default: ''

      confirm_deployment:
        description: Confirm deployment preparation
        type: boolean
        required: true
        default: false

      execute_change_set:
        description: Execute the reviewed CloudFormation change set
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate CloudFormation templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        run: python -m pip install cfn-lint

      - name: Lint all CloudFormation templates
        run: cfn-lint infra/templates/*.yaml

      - name: Validate selected template input
        if: github.event_name == 'workflow_dispatch'
        env:
          TEMPLATE: ${{ inputs.template }}
        run: |
          set -euo pipefail

          case "$TEMPLATE" in
            network.yaml|ecr.yaml|release-bucket.yaml|database.yaml|ecs-app.yaml|ec2-app.yaml|codedeploy.yaml)
              test -f "infra/templates/$TEMPLATE"
              ;;
            *)
              echo "::error::Unsupported CloudFormation template: $TEMPLATE"
              exit 1
              ;;
          esac

  prepare:
    name: Prepare CloudFormation change set
    runs-on: ubuntu-latest
    needs: validate

    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_deployment == true

    permissions:
      contents: read
      id-token: write

    outputs:
      change_set_name: ${{ steps.changeset.outputs.name }}
      stack_name: ${{ steps.changeset.outputs.stack }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment context
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
          STACK_NAME: ${{ inputs.stack_name }}
          TEMPLATE: ${{ inputs.template }}
        run: |
          set -euo pipefail

          [[ "$GH_REPOSITORY" == "rajeshgoudk94-png/coditude-devops-assessment" ]] || {
            echo "::error::Unexpected GitHub repository"
            exit 1
          }

          [[ "$GH_REF" == "refs/heads/master" ]] || {
            echo "::error::Deployments must run from master"
            exit 1
          }

          [[ "$STACK_NAME" =~ ^coditude-(dev|staging|prod)-(network|ecr|release-bucket|database|ecs|ec2|codedeploy)$ ]] || {
            echo "::error::Stack name must follow the approved coditude environment naming convention."
            exit 1
          }

          case "$TEMPLATE" in
            network.yaml) EXPECTED_SUFFIX=network ;;
            ecr.yaml) EXPECTED_SUFFIX=ecr ;;
            release-bucket.yaml) EXPECTED_SUFFIX=release-bucket ;;
            database.yaml) EXPECTED_SUFFIX=database ;;
            ecs-app.yaml) EXPECTED_SUFFIX=ecs ;;
            ec2-app.yaml) EXPECTED_SUFFIX=ec2 ;;
            codedeploy.yaml) EXPECTED_SUFFIX=codedeploy ;;
            *) echo "::error::Unsupported template"; exit 1 ;;
          esac

          [[ "$STACK_NAME" == *-"$EXPECTED_SUFFIX" ]] || {
            echo "::error::Stack name does not match the selected template."
            exit 1
          }

          if [[ "$STACK_NAME" == coditude-prod-* || "$STACK_NAME" == coditude-staging-* ]]; then
            echo "::error::Staging and production deployment are not enabled by this workflow yet."
            exit 1
          fi

      - name: Check required configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CFN_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
        run: |
          set -euo pipefail

          [[ -n "$AWS_ROLE_ARN" ]] || {
            echo "::error::AWS_ROLE_ARN is missing"
            exit 1
          }

          [[ -n "$AWS_REGION" ]] || {
            echo "::error::AWS_REGION is missing"
            exit 1
          }

          [[ -n "$CFN_ROLE_ARN" ]] || {
            echo "::error::CLOUDFORMATION_EXECUTION_ROLE_ARN is missing"
            exit 1
          }

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsInfrastructure
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate selected template in AWS
        env:
          TEMPLATE: ${{ inputs.template }}
        run: |
          set -euo pipefail

          aws cloudformation validate-template \
            --template-body "file://infra/templates/${TEMPLATE}"

      - name: Create change set
        id: changeset
        env:
          STACK_NAME: ${{ inputs.stack_name }}
          TEMPLATE: ${{ inputs.template }}
          PARAMS: ${{ inputs.parameter_overrides }}
          CFN_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
        run: |
          set -euo pipefail

          CHANGE_SET_NAME="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            CHANGE_SET_TYPE=UPDATE
          else
            CHANGE_SET_TYPE=CREATE
          fi

          ARGS=(
            --stack-name "$STACK_NAME"
            --change-set-name "$CHANGE_SET_NAME"
            --change-set-type "$CHANGE_SET_TYPE"
            --template-body "file://infra/templates/${TEMPLATE}"
            --role-arn "$CFN_ROLE_ARN"
            --capabilities CAPABILITY_IAM
          )

          if [[ -n "$PARAMS" ]]; then
            read -r -a PARAM_ARRAY <<< "$PARAMS"
            ARGS+=(--parameters)
            for PARAM in "${PARAM_ARRAY[@]}"; do
              KEY="${PARAM%%=*}"
              VALUE="${PARAM#*=}"
              [[ "$KEY" != "$VALUE" ]] || {
                echo "::error::Invalid parameter format: $PARAM"
                exit 1
              }
              ARGS+=("ParameterKey=$KEY,ParameterValue=$VALUE")
            done
          fi

          aws cloudformation create-change-set "${ARGS[@]}"

          aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" || true

          aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --query '{Status:Status,StatusReason:StatusReason,Changes:Changes[*].ResourceChange.{Action:Action,LogicalResourceId:LogicalResourceId,ResourceType:ResourceType,Replacement:Replacement}}' \
            --output json

          echo "name=$CHANGE_SET_NAME" >> "$GITHUB_OUTPUT"
          echo "stack=$STACK_NAME" >> "$GITHUB_OUTPUT"

  execute:
    name: Execute reviewed change set
    runs-on: ubuntu-latest
    needs: prepare

    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_deployment == true &&
      inputs.execute_change_set == true

    environment: dev

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsInfrastructureExecute
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify change set
        env:
          STACK_NAME: ${{ needs.prepare.outputs.stack_name }}
          CHANGE_SET_NAME: ${{ needs.prepare.outputs.change_set_name }}
        run: |
          set -euo pipefail

          aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --query '{Status:Status,ExecutionStatus:ExecutionStatus,Changes:Changes[*].ResourceChange.{Action:Action,LogicalResourceId:LogicalResourceId,ResourceType:ResourceType,Replacement:Replacement}}' \
            --output json

      - name: Execute change set
        env:
          STACK_NAME: ${{ needs.prepare.outputs.stack_name }}
          CHANGE_SET_NAME: ${{ needs.prepare.outputs.change_set_name }}
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --query Status \
            --output text)

          EXECUTION_STATUS=$(aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --query ExecutionStatus \
            --output text)

          [[ "$STATUS" == "CREATE_COMPLETE" ]] || {
            echo "::error::Change set is not ready: $STATUS"
            exit 1
          }

          [[ "$EXECUTION_STATUS" == "AVAILABLE" ]] || {
            echo "::error::Change set is not available: $EXECUTION_STATUS"
            exit 1
          }

          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME"

          aws cloudformation wait stack-create-complete \
            --stack-name "$STACK_NAME" 2>/dev/null || \
          aws cloudformation wait stack-update-complete \
            --stack-name "$STACK_NAME"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].{StackName:StackName,StackStatus:StackStatus}' \
            --output table
