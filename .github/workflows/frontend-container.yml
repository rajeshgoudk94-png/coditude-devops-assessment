
name: Frontend Container Deployment

on:
  push:
    branches: [master]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-deploy-${{ vars.DEPLOY_ENV || 'dev' }}
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    environment: ${{ vars.DEPLOY_ENV || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}
        run: |
          set -euo pipefail

          for name in AWS_REGION AWS_ROLE_ARN ECR_FRONTEND_REPOSITORY ECS_CLUSTER ECS_FRONTEND_SERVICE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub variable '$name' is missing."
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsFrontendDeploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

