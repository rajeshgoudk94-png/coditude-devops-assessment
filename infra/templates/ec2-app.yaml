AWSTemplateFormatVersion: '2010-09-09'
Description: Non-containerized Next.js and Python services on EC2 behind an ALB. Customize AMI/bootstrap for production.
Parameters:
  EnvironmentName: { Type: String, AllowedValues: [dev, staging, prod] }
  VpcId: { Type: AWS::EC2::VPC::Id }
  PublicSubnetIds: { Type: List<AWS::EC2::Subnet::Id> }
  PrivateSubnetIds: { Type: List<AWS::EC2::Subnet::Id> }
  LatestAmazonLinux2023Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType: { Type: String, Default: t3.small }
  ReleaseBucketName: { Type: String, Default: '', Description: S3 bucket used by CodeDeploy bundles }
Conditions:
  HasReleaseBucket: !Not [!Equals [!Ref ReleaseBucketName, '']]
Resources:
  AlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties: { GroupDescription: 'Public HTTP entry', VpcId: !Ref VpcId, SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}] }
  InstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App instances only receive ALB traffic
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref AlbSG}
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSG}
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
      Policies:
        - PolicyName: ReadReleaseArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !If [HasReleaseBucket, !Sub 'arn:${AWS::Partition}:s3:::${ReleaseBucketName}/*', !Sub 'arn:${AWS::Partition}:s3:::unused-bucket/*']
  InstanceProfile: { Type: AWS::IAM::InstanceProfile, Properties: { Roles: [!Ref InstanceRole] } }
  Alb: { Type: AWS::ElasticLoadBalancingV2::LoadBalancer, Properties: { Scheme: internet-facing, Type: application, Subnets: !Ref PublicSubnetIds, SecurityGroups: [!Ref AlbSG] } }
  FrontendTG: { Type: AWS::ElasticLoadBalancingV2::TargetGroup, Properties: { VpcId: !Ref VpcId, Port: 3000, Protocol: HTTP, TargetType: instance, HealthCheckPath: '/' } }
  BackendTG: { Type: AWS::ElasticLoadBalancingV2::TargetGroup, Properties: { VpcId: !Ref VpcId, Port: 8000, Protocol: HTTP, TargetType: instance, HealthCheckPath: /health } }
  Listener: { Type: AWS::ElasticLoadBalancingV2::Listener, Properties: { LoadBalancerArn: !Ref Alb, Port: 80, Protocol: HTTP, DefaultActions: [{Type: forward, TargetGroupArn: !Ref FrontendTG}] } }
  ApiRule: { Type: AWS::ElasticLoadBalancingV2::ListenerRule, Properties: { ListenerArn: !Ref Listener, Priority: 10, Conditions: [{Field: path-pattern, Values: ['/api/*', '/health']}], Actions: [{Type: forward, TargetGroupArn: !Ref BackendTG}] } }
  FrontendLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmazonLinux2023Ami
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Arn: !GetAtt InstanceProfile.Arn}
        SecurityGroupIds: [!Ref InstanceSG]
        MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
        UserData: !Base64 |
          #!/bin/bash
          set -euxo pipefail
          dnf update -y
          dnf install -y ruby wget nodejs20
          TOKEN=$(curl -sS -X PUT -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" http://169.254.169.254/latest/api/token)
          REGION=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
          cd /tmp && wget -q "https://aws-codedeploy-${REGION}.s3.${REGION}.amazonaws.com/latest/install" -O install
          chmod +x install && ./install auto
          systemctl enable codedeploy-agent && systemctl start codedeploy-agent
  BackendLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmazonLinux2023Ami
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Arn: !GetAtt InstanceProfile.Arn}
        SecurityGroupIds: [!Ref InstanceSG]
        MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
        UserData: !Base64 |
          #!/bin/bash
          set -euxo pipefail
          dnf update -y
          dnf install -y ruby wget python3.12 python3.12-pip
          TOKEN=$(curl -sS -X PUT -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" http://169.254.169.254/latest/api/token)
          REGION=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
          cd /tmp && wget -q "https://aws-codedeploy-${REGION}.s3.${REGION}.amazonaws.com/latest/install" -O install
          chmod +x install && ./install auto
          systemctl enable codedeploy-agent && systemctl start codedeploy-agent
  FrontendASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: !Ref PrivateSubnetIds
      MinSize: '2'
      DesiredCapacity: '2'
      MaxSize: '4'
      LaunchTemplate: {LaunchTemplateId: !Ref FrontendLaunchTemplate, Version: !GetAtt FrontendLaunchTemplate.LatestVersionNumber}
      TargetGroupARNs: [!Ref FrontendTG]
      Tags: [{Key: Name, Value: !Sub '${EnvironmentName}-frontend', PropagateAtLaunch: true}, {Key: Component, Value: frontend, PropagateAtLaunch: true}, {Key: Environment, Value: !Ref EnvironmentName, PropagateAtLaunch: true}]
  BackendASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: !Ref PrivateSubnetIds
      MinSize: '2'
      DesiredCapacity: '2'
      MaxSize: '4'
      LaunchTemplate: {LaunchTemplateId: !Ref BackendLaunchTemplate, Version: !GetAtt BackendLaunchTemplate.LatestVersionNumber}
      TargetGroupARNs: [!Ref BackendTG]
      Tags: [{Key: Name, Value: !Sub '${EnvironmentName}-backend', PropagateAtLaunch: true}, {Key: Component, Value: backend, PropagateAtLaunch: true}, {Key: Environment, Value: !Ref EnvironmentName, PropagateAtLaunch: true}]
Outputs:
  LoadBalancerDNS: { Value: !GetAtt Alb.DNSName }
  AppSecurityGroupId: { Value: !Ref InstanceSG }
