AWSTemplateFormatVersion: '2010-09-09'
Description: Private ECR repositories for immutable frontend and backend images.
Parameters:
  EnvironmentName: {Type: String, AllowedValues: [dev, staging, prod]}
Resources:
  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${EnvironmentName}-coditude-frontend'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the newest 30 tagged images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}'
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${EnvironmentName}-coditude-backend'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the newest 30 tagged images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}'
Outputs:
  FrontendRepositoryUri: {Value: !GetAtt FrontendRepository.RepositoryUri}
  BackendRepositoryUri: {Value: !GetAtt BackendRepository.RepositoryUri}
